version: '3.8'

services:
  # ===== 后端服务（使用刚构建的镜像） =====
  backend:
    image: file-review-backend:latest
    container_name: file_review_backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://file_review_user:file_review_password@postgres:5432/file_review_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: enterprise-review-system-jwt-secret-2026
      JWT_EXPIRES_IN: 1d
      PARSER_SERVICE_URL: http://doc-parser:8000
      TZ: Asia/Shanghai
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      doc-parser:
        condition: service_started
    restart: unless-stopped

  # ===== 前端服务（使用刚构建的镜像） =====
  frontend:
    image: file-review-frontend:latest
    container_name: file_review_frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
