# ============================================
# 本地开发环境 - 挂载 dist 目录
# 用于快速验证代码修改，无需重新构建镜像
# 
# 使用方法:
#   1. 确保基础服务已运行（PostgreSQL、Redis、MarkItDown、MaxKB）
#   2. 启动开发模式: docker compose --env-file .env.local -f docker-compose.local.yml up -d
#   3. 修改代码后重新构建: npm run build (frontend/backend)
#   4. 重启容器加载最新代码: docker restart file_review_backend file_review_frontend
# ============================================

services:
  # 后端 API 服务 - 挂载本地 dist
  backend:
    image: file-review-backend:v1.5
    container_name: file_review_backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://file_review_user:file_review_password@file_review_postgres_dev:5432/file_review_db
      - REDIS_URL=redis://file_review_redis_dev:6379
      - JWT_SECRET=${JWT_SECRET:-enterprise-review-system-jwt-secret-2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - PARSER_SERVICE_URL=http://file_review_markitdown_dev:8000
      - MAXKB_BASE_URL=http://file_review_maxkb:8080
      - MAXKB_PUBLIC_URL=http://localhost:8080
      - TZ=Asia/Shanghai
    volumes:
      - ./backend/dist:/app/dist
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - file-review-network

  # 前端 Web 服务 - 挂载本地 dist
  frontend:
    image: file-review-frontend:v1.5
    container_name: file_review_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - file-review-network

networks:
  file-review-network:
    external: true

volumes:
  uploads:
    driver: local
