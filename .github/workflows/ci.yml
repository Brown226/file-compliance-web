# CI 门禁：后端测试/类型 + 前端测试/类型/构建
#
# 触发：push 到 main / v2.0 + 所有 PR。
# 全部测试均为 mock 隔离（无 DB/Redis/LLM 依赖），CI 无需起服务。
name: CI

on:
  push:
    branches: [main, v2.0]
  pull_request:

jobs:
  backend:
    name: Backend (vitest + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Unit tests
        run: npx vitest run
        working-directory: backend
      - name: Type check
        run: npx tsc --noEmit
        working-directory: backend

  frontend:
    name: Frontend (vitest + vue-tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Unit tests
        run: npx vitest run
        working-directory: frontend
      - name: Type check
        run: npx vue-tsc --noEmit
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
