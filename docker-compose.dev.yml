# ============================================
# 本地开发环境 - 完整配置
# 包含: PostgreSQL + Redis + MarkItDown + MaxKB + 后端(挂载dist) + 前端(挂载dist)
# 
# 使用方法:
#   1. 首次启动: docker compose --env-file .env.local -f docker-compose.dev.yml up -d
#   2. 修改代码后: npm run build (frontend/backend)
#   3. 重启容器: docker restart file_review_backend file_review_frontend
# ============================================

services:
  # ==========================================
  # PostgreSQL 15 数据库（含 pgvector）
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg15
    container_name: file_review_postgres_dev
    environment:
      POSTGRES_USER: file_review_user
      POSTGRES_PASSWORD: file_review_password
      POSTGRES_DB: file_review_db
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file_review_user -d file_review_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - file-review-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ==========================================
  # Redis 7 缓存
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: file_review_redis_dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - file-review-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ==========================================
  # MarkItDown 文档解析服务
  # ==========================================
  markitdown:
    image: file-review-markitdown:v1.0
    container_name: file_review_markitdown_dev
    ports:
      - "${PARSER_PORT:-8000}:8000"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - file-review-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ==========================================
  # MaxKB 知识库服务 - 简化版（不包含PostgreSQL和Redis）
  # ==========================================
  maxkb:
    image: registry.fit2cloud.com/maxkb/maxkb:v2.8.0
    container_name: file_review_maxkb
    hostname: maxkb
    ports:
      - "${MAXKB_PORT:-8080}:8080"
    volumes:
      - maxkb-logs:/opt/maxkb/logs
      - maxkb-local:/opt/maxkb/local
    env_file:
      - maxkb-runtime/maxkb/conf/maxkb.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 120
      start_period: 120s
    command: ['/usr/bin/start-maxkb.sh']
    networks:
      - file-review-network

  # ==========================================
  # 后端 API 服务 - 挂载本地 dist
  # ==========================================
  backend:
    image: file-review-backend:v1.5
    container_name: file_review_backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://file_review_user:file_review_password@file_review_postgres_dev:5432/file_review_db
      - REDIS_URL=redis://file_review_redis_dev:6379
      - JWT_SECRET=${JWT_SECRET:-enterprise-review-system-jwt-secret-2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - PARSER_SERVICE_URL=http://file_review_markitdown_dev:8000
      - MAXKB_BASE_URL=http://file_review_maxkb:8080
      - MAXKB_PUBLIC_URL=http://localhost:8080
      - TZ=Asia/Shanghai
    volumes:
      - ./backend/dist:/app/dist
      - uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      markitdown:
        condition: service_healthy
      maxkb:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - file-review-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ==========================================
  # 前端 Web 服务 (Nginx) - 挂载本地 dist
  # ==========================================
  frontend:
    image: file-review-frontend:v1.5
    container_name: file_review_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - file-review-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

networks:
  file-review-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads:
    driver: local
  maxkb-logs:
    driver: local
  maxkb-local:
    driver: local
