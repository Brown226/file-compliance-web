server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 请求体大小限制（支持大文件上传）
    client_max_body_size 100M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # 前端路由 fallback（index.html 不缓存，确保版本更新及时生效）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理后台入口（避免被 /admin/ 代理拦截）
    location = /admin {
        try_files $uri /index.html;
    }

    # Vue 前端管理路由（必须在 /admin/ 代理之前，解决路由冲突）
    # 这些路由由 Vue 前端处理，不代理到 MaxKB
    # 注意：/admin/ 代理用的是普通前缀（非 ^~），否则会短路下面的正则
    location ~ ^/admin/(dashboard|standards|knowledge$|knowledge-categories|rule-libraries|rules|prompts|system|users|storage|ai-engine|ai-call-dashboard|basic|audit|feedback|llm-config|feature-flags) {
        try_files $uri /index.html;
    }

    # index.html 不缓存（文件名哈希化的 JS/CSS 可长期缓存）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # API 请求代理到后端
    # 2026-08-28 流式修复：Agent 对话（/api/agent/chat/stream）走 SSE，
    # nginx 默认 proxy_buffering on 会把流攒满缓冲区才吐给浏览器，
    # 表现为「长时间无输出 → 一口气全部输出」。必须关闭缓冲并放宽读超时，
    # 否则长工具链（单次可跑 10 步、数分钟）还会在 60s 被掐断造成对话中断。
    location /api/ {
        proxy_pass http://file_review_backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ---- 流式响应支持（SSE 实时透传）----
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        add_header X-Accel-Buffering no always;
        # ---- 长连接与分块传输 ----
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        # Agent 长工具链可运行数分钟：读/写超时从 60s 放宽到 30 分钟
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 60s;
    }

    # MaxKB 聊天页面代理（同源嵌入 iframe）
    location /chat/ {
        proxy_pass http://file_review_maxkb:8080/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # 允许 iframe 嵌入
        add_header X-Frame-Options "" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # MaxKB 管理面板代理（语义知识库页面）
    # 注意：必须用普通前缀（不用 ^~），否则会短路上面的 Vue 管理路由正则
    location /admin/ {
        proxy_pass http://file_review_maxkb:8080/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header X-Frame-Options "" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # WebSocket 代理
    location /ws {
        proxy_pass http://file_review_backend:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        send_timeout 86400s;
    }

    # 上传文件访问代理（后端静态服务 /uploads/ 目录）
    location /uploads/ {
        proxy_pass http://file_review_backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WASM 文件：不压缩，长缓存
    location ~* \.wasm$ {
        gzip off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/wasm";
    }

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "OK";
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
