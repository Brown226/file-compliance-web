version: '3.8'

services:
  ocr-service:
    build:
      context: ./backend/ocr-service
      dockerfile: Dockerfile
    container_name: file_review_ocr
    ports:
      - "8001:8000"
    environment:
      - TZ=Asia/Shanghai
      - FLAGS_use_mkldnn=0
    volumes:
      - ocr_models:/root/.paddleocr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
          cpus: "1.0"

volumes:
  ocr_models:
    driver: local